[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-core"
version = "0.2.0"
description = "Core AE, K-means, DDPM, MLP routing and RCNN components for flood forecasting"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "einops", "tqdm", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
